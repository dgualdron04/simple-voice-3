<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de robots UDI</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f4f3f0;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7b7a75;
  --grid: #e6e5e1; --border: #e3e2dd;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --neutral: #9a9992;
  --seq-1: #b7d3f6; --seq-2: #6da7ec; --seq-3: #256abf;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --focus: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8e8d85;
    --grid: #2d2d2a; --border: #2d2d2a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --neutral: #6b6a64;
    --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #6da7ec; --focus: #6da7ec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8e8d85;
  --grid: #2d2d2a; --border: #2d2d2a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --neutral: #6b6a64;
  --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #6da7ec; --focus: #6da7ec;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 64px; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 22px 0 14px; }
header h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
header .sub { color: var(--text-2); font-size: 13px; }
.spacer { flex: 1; }
.badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text-2); }
.badge.demo { background: #fab21922; border-color: #fab219; color: var(--text); }
button, select, input { font: inherit; color: inherit; }
.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--text-3); }
.btn:focus-visible, select:focus-visible, input:focus-visible, .tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn.primary { background: var(--s1); border-color: var(--s1); color: #fff; }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--s1); font-weight: 600; }
.filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.filters label { color: var(--text-2); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 6px 12px; cursor: pointer; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--s1); color: #fff; }
select, input[type=search] { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-6 { grid-column: span 6; }
.span-4 { grid-column: span 4; } .span-3 { grid-column: span 3; }
@media (max-width: 900px) { .span-8, .span-6, .span-4, .span-3 { grid-column: span 12; } }
@media (min-width: 901px) and (max-width: 1100px) { .span-3 { grid-column: span 6; } }
.card h2 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
.card .hint { font-size: 12.5px; color: var(--text-2); margin: 0 0 12px; }
.card .head { display: flex; align-items: flex-start; gap: 8px; }
.card .head > div:first-child { flex: 1; }
.link { background: none; border: 0; color: var(--text-2); cursor: pointer; font-size: 12.5px; padding: 2px 6px; border-radius: 6px; }
.link:hover { background: var(--surface-2); color: var(--text); }
.kpi .label { color: var(--text-2); font-size: 13px; }
.kpi .value { font-size: 30px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .note { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.hero .value { font-size: 56px; line-height: 1.05; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin: 0 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text-2); font: 11.5px system-ui, sans-serif; }
svg .val { fill: var(--text); font-weight: 600; }
svg .gl { stroke: var(--grid); stroke-width: 1; }
svg .mark { transition: opacity .12s; }
svg .mark:hover, svg .mark:focus { opacity: .78; outline: none; }
.tablewrap { overflow: auto; max-height: 420px; border: 1px solid var(--border); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td.wrap-text { white-space: normal; min-width: 240px; }
th { position: sticky; top: 0; background: var(--surface-2); color: var(--text-2); font-weight: 600; font-size: 12.5px; cursor: pointer; user-select: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); }
.pill.nuevo { border-color: var(--s1); } .pill.contactado { border-color: var(--good); } .pill.descartado { color: var(--text-3); }
.pii { font-variant-numeric: tabular-nums; }
.empty { color: var(--text-3); padding: 18px; text-align: center; font-size: 13.5px; }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--text); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: 12.5px; opacity: 0; transition: opacity .1s; max-width: 280px; }
#tip b { font-size: 14px; display: block; }
.notice { font-size: 12.5px; color: var(--text-2); background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 14px; }
.rowtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.sr { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Panel de robots UDI</h1>
      <div class="sub" id="sub">Pre-registros y uso del asistente de voz</div>
    </div>
    <span class="badge demo" id="demo" hidden>DATOS DE DEMOSTRACIÓN</span>
    <div class="spacer"></div>
    <button class="btn" id="theme" aria-label="Cambiar tema claro u oscuro">Tema</button>
    <button class="btn" id="refresh">Actualizar</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-reg" aria-selected="true" aria-controls="view-reg">Inscripciones</button>
    <button class="tab" role="tab" id="tab-use" aria-selected="false" aria-controls="view-use">Uso del robot</button>
  </nav>

  <!-- ===================== INSCRIPCIONES ===================== -->
  <section id="view-reg" role="tabpanel" aria-labelledby="tab-reg">
    <div class="filters">
      <label>Periodo</label>
      <div class="seg" id="reg-range" role="group" aria-label="Periodo">
        <button data-d="7" aria-pressed="false">7 días</button>
        <button data-d="30" aria-pressed="true">30 días</button>
        <button data-d="0" aria-pressed="false">Todo</button>
      </div>
      <span class="spacer"></span>
      <a class="btn" id="csv" href="/api/registrations.csv" download>Descargar CSV</a>
    </div>
    <div class="notice">Los datos personales aparecen ocultos. Revélalos solo si los necesitas: este panel funciona únicamente en este equipo.</div>
    <div class="grid" id="reg-kpis"></div>
    <div class="grid" style="margin-top:14px" id="reg-charts"></div>
    <div class="card" style="margin-top:14px">
      <div class="head"><div><h2>Pre-registros</h2><p class="hint">Cambia el estado cuando un asesor llame a la persona.</p></div></div>
      <div class="rowtools">
        <input type="search" id="q" placeholder="Buscar programa, robot, nombre…" aria-label="Buscar">
        <select id="f-estado" aria-label="Estado"><option value="">Todos los estados</option></select>
        <select id="f-tipo" aria-label="Tipo"><option value="">Todos los tipos</option><option value="preregistro">Pre-registro</option><option value="solo_telefono">Solo teléfono</option></select>
        <select id="f-prog" aria-label="Programa"><option value="">Todos los programas</option></select>
        <span class="spacer"></span>
        <button class="btn" id="reveal" aria-pressed="false">Mostrar datos personales</button>
      </div>
      <div class="tablewrap"><table id="reg-table"></table></div>
    </div>
  </section>

  <!-- ===================== USO ===================== -->
  <section id="view-use" role="tabpanel" aria-labelledby="tab-use" hidden>
    <div class="filters">
      <label>Periodo</label>
      <div class="seg" id="use-range" role="group" aria-label="Periodo">
        <button data-d="1" aria-pressed="false">Hoy</button>
        <button data-d="3" aria-pressed="false">3 días</button>
        <button data-d="7" aria-pressed="true">7 días</button>
        <button data-d="14" aria-pressed="false">14 días</button>
      </div>
      <label for="use-robot">Robot</label>
      <select id="use-robot"><option value="">Todos</option></select>
      <span class="spacer"></span>
      <button class="btn primary" id="copy-report">Copiar informe para Claude</button>
    </div>
    <div class="grid" id="use-kpis"></div>
    <div class="grid" style="margin-top:14px" id="use-charts"></div>
    <div class="grid" style="margin-top:14px" id="use-tables"></div>
  </section>
</div>
<div id="tip" role="status"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const token = new URLSearchParams(location.search).get("token") || "";
const nf = new Intl.NumberFormat("es-CO");
const state = { regs: [], usage: null, regDays: 30, useDays: 7, reveal: false, sort: { key: "created_at", dir: -1 } };

// ---------- util DOM (siempre textContent: los datos no son de confianza)
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function s(tag, attrs = {}, ...kids) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), "X-Token": token } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
const fmtDate = iso => new Date(iso).toLocaleString("es-CO", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
const dayLabel = d => new Date(d + "T12:00").toLocaleDateString("es-CO", { day: "numeric", month: "short" });
const compact = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(".0", "") + "K" : String(n);
const ms = n => n >= 1000 ? (n / 1000).toFixed(1) + " s" : Math.round(n) + " ms";

// ---------- tooltip
const tip = $("#tip");
function showTip(ev, title, lines) {
  tip.replaceChildren(h("b", { text: title }), ...lines.map(l => h("div", { text: l })));
  const pad = 14, w = tip.offsetWidth || 160;
  tip.style.left = Math.min(innerWidth - w - 8, ev.clientX + pad) + "px";
  tip.style.top = (ev.clientY + pad) + "px";
  tip.style.opacity = 1;
}
const hideTip = () => { tip.style.opacity = 0; };
function mark(el, title, lines) {
  el.classList.add("mark"); el.setAttribute("tabindex", "0"); el.setAttribute("aria-label", title + ": " + lines.join(", "));
  el.addEventListener("pointermove", e => showTip(e, title, lines));
  el.addEventListener("pointerleave", hideTip);
  el.addEventListener("focus", () => { const r = el.getBoundingClientRect(); showTip({ clientX: r.left + r.width / 2, clientY: r.top }, title, lines); });
  el.addEventListener("blur", hideTip);
  return el;
}

// ---------- gráficos (SVG a mano: sin librerías ni internet)
function roundedTop(x, y, w, hgt, r) {
  r = Math.min(r, w / 2, hgt);
  return `M${x},${y + hgt} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + hgt} Z`;
}
function roundedRight(x, y, w, hgt, r) {
  r = Math.min(r, hgt / 2, w);
  return `M${x},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + hgt - r} Q${x + w},${y + hgt} ${x + w - r},${y + hgt} H${x} Z`;
}
function niceScale(v) {
  v = Math.max(1, v);
  const p = Math.pow(10, Math.floor(Math.log10(v)) - 1);
  for (const m of [1, 2, 5, 10, 20, 50, 100]) {
    const step = m * p; const n = Math.ceil(v / step);
    if (n <= 6 && step >= 1) return { max: n * step, step, n };
  }
  const step = Math.ceil(v / 5); return { max: step * 5, step, n: 5 };
}

/** Columnas verticales. series: [{key,label,color}], data: [{label, <key>: n}] (apiladas con 2px de separación). */
function columns(data, series, { height = 230, unit = "", labelEvery = 1 } = {}) {
  const W = 640, m = { l: 36, r: 8, t: 10, b: 28 }, H = height;
  const totals = data.map(d => series.reduce((a, x) => a + (d[x.key] || 0), 0));
  const sc = niceScale(Math.max(1, ...totals)), max = sc.max;
  const iw = W - m.l - m.r, ih = H - m.t - m.b, slot = iw / Math.max(1, data.length);
  const bw = Math.min(24, slot * 0.7);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  for (let i = 0; i <= sc.n; i++) {
    const v = sc.step * i, y = m.t + ih - (v / max) * ih;
    svg.append(s("line", { class: "gl", x1: m.l, x2: W - m.r, y1: y, y2: y }), s("text", { x: m.l - 6, y: y + 4, "text-anchor": "end" }, compact(v)));
  }
  data.forEach((d, i) => {
    const cx = m.l + slot * i + slot / 2; let acc = 0;
    series.forEach((sr, si) => {
      const v = d[sr.key] || 0; if (!v) return;
      const hgt = Math.max(2, (v / max) * ih), y = m.t + ih - ((acc + v) / max) * ih;
      const last = series.slice(si + 1).every(x => !(d[x.key] || 0));
      const gap = acc > 0 ? 1 : 0;                       // 2px de superficie entre segmentos
      const path = last ? roundedTop(cx - bw / 2, y, bw, hgt - gap, 4) : `M${cx - bw / 2},${y} h${bw} v${hgt - gap} h${-bw} Z`;
      svg.append(mark(s("path", { d: path, fill: sr.color }), d.label, series.map(x => `${x.label}: ${nf.format(d[x.key] || 0)}${unit}`)));
      acc += v;
    });
    if (i % labelEvery === 0) svg.append(s("text", { x: cx, y: H - 8, "text-anchor": "middle" }, d.label));
  });
  return svg;
}

/** Barras horizontales (categorías con nombre largo). rows: [{label, value, color?}] */
function hbars(rows, { color = "var(--s1)", unit = "", max: forced, w: W = 640, labelW = 190 } = {}) {
  const rowH = 30, H = Math.max(40, rows.length * rowH + 6);
  const max = forced || Math.max(1, ...rows.map(r => r.value));
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  rows.forEach((r, i) => {
    const y = i * rowH + 4, bw = Math.max(r.value ? 3 : 0, (r.value / max) * (W - labelW - 70));
    const cut = Math.floor(labelW / 7); const name = r.label.length > cut ? r.label.slice(0, cut - 1) + "…" : r.label;
    svg.append(s("text", { x: labelW - 10, y: y + 15, "text-anchor": "end" }, name));
    if (r.value) svg.append(mark(s("path", { d: roundedRight(labelW, y + 3, bw, 18, 4), fill: r.color || color }), r.label, [nf.format(r.value) + unit]));
    svg.append(s("text", { class: "val", x: labelW + bw + 8, y: y + 16 }, nf.format(r.value) + unit));
  });
  return svg;
}

/** Barra 100% apilada con leyenda y valores. parts: [{label,value,color}] */
function stack100(parts, W = 640) {
  const total = parts.reduce((a, p) => a + p.value, 0) || 1, H = 44;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  let x = 0;
  parts.forEach(p => {
    const w = (p.value / total) * W; if (!p.value) return;
    const pct = Math.round(100 * p.value / total);
    svg.append(mark(s("rect", { x: x + 1, y: 6, width: Math.max(0, w - 2), height: 26, rx: 4, fill: p.color }), p.label, [`${nf.format(p.value)} (${pct}%)`]));
    if (w > 70) svg.append(s("text", { x: x + w / 2, y: 24, "text-anchor": "middle", style: "fill:#fff;font-weight:600" }, pct + "%"));
    x += w;
  });
  return svg;
}
function legend(items) {
  return h("div", { class: "legend" }, items.map(i => h("span", {}, h("i", { style: `background:${i.color}` }), i.label + (i.value != null ? ` · ${nf.format(i.value)}` : ""))));
}

/** Tarjeta con título, gráfico y vista de tabla alternativa (accesibilidad). */
function chartCard({ span, title, hint, chart, legendEl, rows, cols }) {
  const body = h("div", {}, legendEl || null, chart);
  const table = h("div", { class: "tablewrap" }, tableOf(cols, rows)); table.hidden = true;
  const toggle = h("button", { class: "link", "aria-pressed": "false", text: "Ver tabla" });
  toggle.addEventListener("click", () => {
    const t = table.hidden; table.hidden = !t; body.hidden = t;
    toggle.textContent = t ? "Ver gráfico" : "Ver tabla"; toggle.setAttribute("aria-pressed", String(t));
  });
  return h("div", { class: "card " + span }, h("div", { class: "head" }, h("div", {}, h("h2", { text: title }), hint ? h("p", { class: "hint", text: hint }) : null), toggle), body, table);
}
function tableOf(cols, rows) {
  const t = h("table");
  t.append(h("thead", {}, h("tr", {}, cols.map(c => h("th", { class: c.num ? "num" : "", text: c.label })))));
  t.append(h("tbody", {}, rows.length ? rows.map(r => h("tr", {}, cols.map(c => h("td", { class: c.num ? "num" : "", text: String(c.get(r) ?? "") })))) : h("tr", {}, h("td", { colspan: cols.length, class: "empty", text: "Sin datos" }))));
  return t;
}
const kpi = (span, label, value, note, extra = "") => h("div", { class: `card kpi ${span} ${extra}` }, h("div", { class: "label", text: label }), h("div", { class: "value", text: value }), note ? h("div", { class: "note", text: note }) : null);
const COL = { s1: "var(--s1)", s2: "var(--s2)", s3: "var(--s3)", n: "var(--neutral)" };

// =====================================================================================
//                                    INSCRIPCIONES
// =====================================================================================
const mask = {
  nombre: v => !v ? "—" : v.split(" ").map((w, i) => i === 0 ? w : w[0] + "•••").join(" "),
  telefono: v => !v ? "—" : v.length >= 7 ? v.slice(0, 3) + " ••• " + v.slice(-4) : "••••",
  correo: v => { if (!v) return "—"; const [a, b] = v.split("@"); return (a[0] || "") + "•••@" + (b || ""); },
};
const pretty = { preregistro: "Pre-registro", solo_telefono: "Solo teléfono" };
const ROBOTS = { g1: "Zuu (G1)", h2: "Teamsu (H2)", go2x: "Axl (Go2 X)", laptop: "Portátil" };

function inRange(r) {
  if (!state.regDays) return true;
  return Date.now() - new Date(r.created_at).getTime() <= state.regDays * 864e5;
}
function countBy(rows, f) { const m = new Map(); rows.forEach(r => { const k = f(r); m.set(k, (m.get(k) || 0) + 1); }); return m; }

function renderRegistrations() {
  const rows = state.regs.filter(inRange);
  const total = rows.length, nuevos = rows.filter(r => r.estado === "nuevo").length;
  const contactados = rows.filter(r => r.estado === "contactado").length;
  const soloTel = rows.filter(r => r.tipo === "solo_telefono").length;
  const k = $("#reg-kpis"); k.replaceChildren(
    kpi("span-6", "Pre-registros", nf.format(total), state.regDays ? `en los últimos ${state.regDays} días` : "desde el inicio", "hero"),
    kpi("span-3", "Por contactar", nf.format(nuevos), total ? `${Math.round(100 * nuevos / total)}% del periodo` : ""),
    kpi("span-3", "Ya contactados", nf.format(contactados), total ? `${Math.round(100 * contactados / total)}% del periodo` : ""));

  // por día (rellena los días vacíos)
  const days = state.regDays || Math.min(60, Math.max(7, Math.ceil((Date.now() - Math.min(...rows.map(r => new Date(r.created_at)), Date.now())) / 864e5) + 1));
  const perDay = [];
  for (let i = days - 1; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5); perDay.push({ day: d.toISOString().slice(0, 10), localDay: d.toLocaleDateString("sv") }); }
  const byDay = countBy(rows, r => new Date(r.created_at).toLocaleDateString("sv"));
  const dayData = perDay.map(d => ({ label: dayLabel(d.localDay), Pre: 0, Tel: 0 }));
  rows.forEach(r => { const idx = perDay.findIndex(d => d.localDay === new Date(r.created_at).toLocaleDateString("sv")); if (idx >= 0) dayData[idx][r.tipo === "solo_telefono" ? "Tel" : "Pre"]++; });
  const dseries = [{ key: "Pre", label: "Pre-registro completo", color: COL.s1 }, { key: "Tel", label: "Solo teléfono", color: COL.s2 }];

  const progs = [...countBy(rows.filter(r => r.programa), r => r.programa)].sort((a, b) => b[1] - a[1]);
  const progRows = progs.map(([label, value]) => ({ label, value }));
  const jor = countBy(rows.filter(r => r.jornada), r => r.jornada), mod = countBy(rows.filter(r => r.modalidad), r => r.modalidad);
  const jParts = [{ label: "Diurna", value: jor.get("diurna") || 0, color: COL.s1 }, { label: "Nocturna", value: jor.get("nocturna") || 0, color: COL.s2 }];
  const mParts = [{ label: "Presencial", value: mod.get("presencial") || 0, color: COL.s1 }, { label: "Virtual", value: mod.get("virtual") || 0, color: COL.s2 }];
  const rob = [...countBy(rows, r => ROBOTS[r.robot_id] || r.robot_id)].sort((a, b) => b[1] - a[1]).map(([label, value]) => ({ label, value }));

  const preferencias = h("div", {}, h("div", { class: "hint", text: "Jornada" }), legend(jParts.map(p => ({ ...p }))), stack100(jParts, 360),
    h("div", { class: "hint", style: "margin-top:12px", text: "Modalidad" }), legend(mParts.map(p => ({ ...p }))), stack100(mParts, 360));
  const cc = $("#reg-charts"); cc.replaceChildren(
    chartCard({ span: "span-8", title: "Pre-registros por día", hint: "Cada columna es un día; el color distingue el tipo de registro.", chart: columns(dayData, dseries, { labelEvery: Math.ceil(dayData.length / 10) }),
      legendEl: legend(dseries), rows: dayData, cols: [{ label: "Día", get: r => r.label }, { label: "Pre-registro", num: 1, get: r => r.Pre }, { label: "Solo teléfono", num: 1, get: r => r.Tel }] }),
    chartCard({ span: "span-4", title: "Preferencias", hint: "Entre quienes eligieron carrera.", chart: preferencias,
      rows: [...jParts, ...mParts], cols: [{ label: "Opción", get: r => r.label }, { label: "Registros", num: 1, get: r => r.value }] }),
    chartCard({ span: "span-8", title: "Carreras de interés", hint: "Cuántas personas dejaron cada programa como interés.", chart: hbars(progRows, { w: 700, labelW: 200 }),
      rows: progRows, cols: [{ label: "Programa", get: r => r.label }, { label: "Registros", num: 1, get: r => r.value }] }),
    chartCard({ span: "span-4", title: "Por robot", hint: "Dónde se capturaron.", chart: hbars(rob, { color: "var(--s3)", w: 360, labelW: 130 }),
      rows: rob, cols: [{ label: "Robot", get: r => r.label }, { label: "Registros", num: 1, get: r => r.value }] }));

  // filtros de la tabla
  const fp = $("#f-prog"), cur = fp.value;
  fp.replaceChildren(h("option", { value: "", text: "Todos los programas" }), ...[...new Set(state.regs.map(r => r.programa).filter(Boolean))].sort().map(p => h("option", { value: p, text: p })));
  fp.value = cur;
  renderRegTable(rows);
}

function renderRegTable(base) {
  const q = $("#q").value.trim().toLowerCase(), fe = $("#f-estado").value, ft = $("#f-tipo").value, fp = $("#f-prog").value;
  let rows = base.filter(r => (!fe || r.estado === fe) && (!ft || r.tipo === ft) && (!fp || r.programa === fp) &&
    (!q || [r.programa, r.robot_id, ROBOTS[r.robot_id], r.nombre, r.correo, r.telefono, r.jornada, r.modalidad].filter(Boolean).join(" ").toLowerCase().includes(q)));
  const { key, dir } = state.sort;
  rows = rows.slice().sort((a, b) => ((a[key] ?? "") > (b[key] ?? "") ? 1 : -1) * dir);
  const cols = [["created_at", "Fecha"], ["nombre", "Nombre"], ["telefono", "Teléfono"], ["correo", "Correo"], ["programa", "Programa"], ["jornada", "Jornada"], ["modalidad", "Modalidad"], ["robot_id", "Robot"], ["tipo", "Tipo"], ["estado", "Estado"]];
  const t = $("#reg-table"); t.replaceChildren(
    h("thead", {}, h("tr", {}, cols.map(([k, l]) => h("th", { text: l + (state.sort.key === k ? (dir > 0 ? " ▲" : " ▼") : ""), onclick: () => { state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : 1 }; renderRegistrations(); } })))),
    h("tbody", {}, rows.length ? rows.map(r => {
      const sel = h("select", { "aria-label": "Estado del registro " + r.id }, ["nuevo", "contactado", "descartado"].map(e => h("option", { value: e, text: e[0].toUpperCase() + e.slice(1) })));
      sel.value = r.estado;
      sel.addEventListener("change", async () => { try { await api(`/api/registrations/${r.id}/estado`, { method: "POST", body: JSON.stringify({ estado: sel.value }) }); r.estado = sel.value; renderRegistrations(); } catch (e) { alert("No se pudo guardar: " + e.message); sel.value = r.estado; } });
      const pi = (f, v) => h("td", { class: "pii", text: state.reveal ? (v || "—") : mask[f](v) });
      return h("tr", {}, h("td", { text: fmtDate(r.created_at) }), pi("nombre", r.nombre), pi("telefono", r.telefono), pi("correo", r.correo),
        h("td", { text: r.programa || "—" }), h("td", { text: r.jornada || "—" }), h("td", { text: r.modalidad || "—" }),
        h("td", { text: ROBOTS[r.robot_id] || r.robot_id }), h("td", { text: pretty[r.tipo] || r.tipo }), h("td", {}, sel));
    }) : h("tr", {}, h("td", { colspan: cols.length, class: "empty", text: "No hay registros con esos filtros." }))));
}

// =====================================================================================
//                                     USO DEL ROBOT
// =====================================================================================
const GROUP_COLOR = { directa: COL.s1, llm: COL.s2, registro: COL.s3, ignorada: COL.n, otra: COL.n };
const GROUP_NAME = { directa: "Respuesta directa", llm: "Modelo de lenguaje", registro: "Registro", ignorada: "Ignorada", otra: "Otra" };

function renderUsage() {
  const u = state.usage; if (!u) return;
  const t = u.totals;
  $("#use-kpis").replaceChildren(
    kpi("span-6", "Frases oídas", nf.format(t.frases), `${nf.format(t.atendidas)} atendidas · ${nf.format(t.ignoradas)} ignoradas`, "hero"),
    kpi("span-3", "Respondidas sin modelo", t.pct_directas == null ? "—" : t.pct_directas + "%", "más rápido y sin inventar"),
    kpi("span-3", "Errores", nf.format(t.errores), t.errores ? "revisa la tabla de errores" : "ninguno en el periodo"),
    kpi("span-3", "STT (mediana)", u.latency.stt.n ? ms(u.latency.stt.median) : "—", u.latency.stt.n ? "p90 " + ms(u.latency.stt.p90) : ""),
    kpi("span-3", "LLM primer token (p90)", u.latency.llm_first_token.n ? ms(u.latency.llm_first_token.p90) : "—", u.latency.llm_first_token.n ? "mediana " + ms(u.latency.llm_first_token.median) : ""),
    kpi("span-3", "Pre-registros guardados", nf.format(t.registros_guardados), "capturados en conversación"),
    kpi("span-3", "Arranques", nf.format(t.arranques), "veces que se encendió"));

  const hour = u.by_hour.map((v, i) => ({ label: String(i).padStart(2, "0"), Frases: v }));
  const trimmed = (() => { const first = hour.findIndex(x => x.Frases), last = hour.length - 1 - [...hour].reverse().findIndex(x => x.Frases); return first < 0 ? hour : hour.slice(Math.max(0, first - 1), Math.min(hour.length, last + 2)); })();
  const dayData = u.by_day.map(d => ({ label: dayLabel(d.day), atendidas: d.atendidas, ignoradas: d.ignoradas }));
  const dser = [{ key: "atendidas", label: "Atendidas", color: COL.s1 }, { key: "ignoradas", label: "Ignoradas", color: COL.n }];
  const routes = u.routes.map(r => ({ label: r.route, value: r.count, color: GROUP_COLOR[r.group], group: r.group }));
  const groupsPresent = [...new Set(routes.map(r => r.group))].map(g => ({ label: GROUP_NAME[g], color: GROUP_COLOR[g] }));

  $("#use-charts").replaceChildren(
    chartCard({ span: "span-6", title: "Actividad por hora", hint: "Frases oídas según la hora del día.", chart: columns(trimmed, [{ key: "Frases", label: "Frases", color: COL.s1 }], { labelEvery: 1 }),
      rows: trimmed, cols: [{ label: "Hora", get: r => r.label + ":00" }, { label: "Frases", num: 1, get: r => r.Frases }] }),
    chartCard({ span: "span-6", title: "Atendidas e ignoradas por día", hint: "Muchas ignoradas pueden significar que no lo oyen bien al activarlo.", chart: columns(dayData, dser, { labelEvery: Math.ceil(dayData.length / 8) }),
      legendEl: legend(dser), rows: dayData, cols: [{ label: "Día", get: r => r.label }, { label: "Atendidas", num: 1, get: r => r.atendidas }, { label: "Ignoradas", num: 1, get: r => r.ignoradas }] }),
    chartCard({ span: "span-12", title: "¿Qué decidió el robot?", hint: "Cada ruta es una decisión del motor. Azul: respuesta directa; naranja: modelo de lenguaje (puede inventar).", chart: hbars(routes.slice(0, 18)),
      legendEl: legend(groupsPresent), rows: routes, cols: [{ label: "Ruta", get: r => r.label }, { label: "Tipo", get: r => GROUP_NAME[r.group] }, { label: "Veces", num: 1, get: r => r.value }] }));

  const T = (span, title, hint, cols, rows) => h("div", { class: "card " + span }, h("div", { class: "head" }, h("div", {}, h("h2", { text: title }), h("p", { class: "hint", text: hint }))), h("div", { class: "tablewrap" }, tableOf(cols, rows)));
  const when = { label: "Cuándo", get: r => fmtDate(r.ts) };
  $("#use-tables").replaceChildren(
    T("span-6", `Frases ignoradas (${u.ignored.length})`, "¿Alguna era para el robot? Si sí, hay que mejorar la activación.", [when, { label: "Motivo", get: r => ({ no_wake: "sin activación", noise: "ruido", echo: "eco", single_word: "palabra suelta", bot_speaking: "robot hablando" }[r.reason] || r.reason) }, { label: "Oyó", get: r => r.heard }], u.ignored.slice().reverse()),
    T("span-6", "Preguntas que fueron al modelo", "Candidatas a respuesta fija (FAQ): lo que más se repite.", [{ label: "Pregunta", get: r => r.text }, { label: "Veces", num: 1, get: r => r.count }], u.llm_questions),
    T("span-6", "Respuestas del modelo para auditar", "Revisa que no inventen datos.", [when, { label: "1er token", num: 1, get: r => r.ms ? ms(r.ms) : "" }, { label: "Respuesta", get: r => r.answer }], u.llm_answers),
    T("span-6", "Transcripciones dudosas", "Baja confianza del reconocimiento de voz.", [when, { label: "Confianza", num: 1, get: r => r.logprob }, { label: "Oyó", get: r => r.heard }, { label: "Ruta", get: r => r.route }], u.doubtful.concat(u.discarded.map(d => ({ ...d, route: "descartada" })))),
    T("span-12", `Errores y avisos (${u.errors.length + u.system.length})`, "Excepciones del diálogo y avisos del sistema.", [{ label: "Detalle", get: r => r.detail }], u.errors.map(e => ({ detail: `${fmtDate(e.ts)} · ${e.where}: ${e.error}` })).concat(u.system.map(x => ({ detail: x })))));
}

function reportMarkdown() {
  const u = state.usage, t = u.totals, L = [];
  L.push(`# Informe de uso (últimos ${state.useDays} días)`, "", `- Frases oídas: ${t.frases} (atendidas ${t.atendidas}, ignoradas ${t.ignoradas}) | sin modelo: ${t.pct_directas ?? "—"}% | errores: ${t.errores} | registros: ${t.registros_guardados}`,
    `- STT mediana ${u.latency.stt.median} ms (p90 ${u.latency.stt.p90}) | LLM primer token mediana ${u.latency.llm_first_token.median} ms (p90 ${u.latency.llm_first_token.p90})`, "", "## Rutas");
  u.routes.forEach(r => L.push(`- ${r.route}: ${r.count}`));
  L.push("", "## Frases ignoradas"); u.ignored.forEach(r => L.push(`- [${r.reason}] ${JSON.stringify(r.heard)}`));
  L.push("", "## Preguntas al modelo"); u.llm_questions.forEach(r => L.push(`- (${r.count}) ${JSON.stringify(r.text)}`));
  L.push("", "## Respuestas del modelo"); u.llm_answers.forEach(r => L.push(`- [${r.route}] ${JSON.stringify(r.answer)}`));
  L.push("", "## Transcripciones dudosas"); u.doubtful.forEach(r => L.push(`- ${r.logprob}: ${JSON.stringify(r.heard)} → ${r.route}`));
  L.push("", "## Errores y avisos"); u.errors.forEach(e => L.push(`- ${e.where}: ${e.error}`)); u.system.forEach(x => L.push(`- ${x}`));
  return L.join("\n");
}

// =====================================================================================
//                                       arranque
// =====================================================================================
async function loadRegs() {
  try { state.regs = await api("/api/registrations"); } catch (e) { state.regs = []; $("#reg-kpis").replaceChildren(h("div", { class: "card span-12 empty", text: "No se pudieron cargar los registros: " + e.message })); return; }
  renderRegistrations();
}
async function loadUsage() {
  try {
    state.usage = await api(`/api/usage?days=${state.useDays}&robot=${encodeURIComponent($("#use-robot").value)}`);
  } catch (e) { $("#use-kpis").replaceChildren(h("div", { class: "card span-12 empty", text: "No se pudo cargar el uso: " + e.message })); return; }
  const sel = $("#use-robot"), cur = sel.value;
  sel.replaceChildren(h("option", { value: "", text: "Todos" }), ...state.usage.robots.map(r => h("option", { value: r, text: ROBOTS[r] || r }))); sel.value = cur;
  renderUsage();
}
function wireSeg(id, onPick) {
  $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
    $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); onPick(+b.dataset.d); });
}
function setTab(which) {
  for (const [t, v] of [["reg", "view-reg"], ["use", "view-use"]]) { $("#tab-" + t).setAttribute("aria-selected", String(t === which)); $("#" + v).hidden = t !== which; }
  if (which === "use" && !state.usage) loadUsage();
}
$("#tab-reg").onclick = () => setTab("reg"); $("#tab-use").onclick = () => setTab("use");
wireSeg("#reg-range", d => { state.regDays = d; renderRegistrations(); });
wireSeg("#use-range", d => { state.useDays = d; loadUsage(); });
$("#use-robot").onchange = loadUsage;
["#q"].forEach(i => $(i).addEventListener("input", () => renderRegistrations()));
["#f-estado", "#f-tipo", "#f-prog"].forEach(i => $(i).addEventListener("change", () => renderRegistrations()));
$("#reveal").onclick = e => { state.reveal = !state.reveal; e.currentTarget.setAttribute("aria-pressed", String(state.reveal)); e.currentTarget.textContent = state.reveal ? "Ocultar datos personales" : "Mostrar datos personales"; renderRegistrations(); };
$("#refresh").onclick = () => { loadRegs(); if (state.usage) loadUsage(); };
$("#copy-report").onclick = async e => { if (!state.usage) return; try { await navigator.clipboard.writeText(reportMarkdown()); e.currentTarget.textContent = "¡Copiado!"; } catch { prompt("Copia el informe:", reportMarkdown()); } setTimeout(() => e.currentTarget.textContent = "Copiar informe para Claude", 1800); };
$("#csv").addEventListener("click", e => { if (token) { e.preventDefault(); location.href = "/api/registrations.csv?token=" + encodeURIComponent(token); } });
$("#theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const next = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = next; try { localStorage.setItem("theme", next); } catch {} };
try { const saved = localStorage.getItem("theme"); if (saved) document.documentElement.dataset.theme = saved; } catch {}

(async () => {
  try {
    const meta = await api("/api/meta");
    $("#sub").textContent = `Asistente ${meta.robot} · pre-registros y uso del robot`;
    $("#demo").hidden = !meta.demo;
    $("#f-estado").append(...meta.estados.map(e => h("option", { value: e, text: e[0].toUpperCase() + e.slice(1) })));
  } catch (e) { $("#sub").textContent = "Sin acceso: " + e.message; }
  loadRegs();
})();
</script>
