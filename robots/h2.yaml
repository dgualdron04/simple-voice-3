# Teamsu - Unitree H2 EDU (Jetson AGX Thor 128 GB). Todo el stack corre en la Thor; el i5 (locomoción) no se toca.
robot:
  id: h2
  name: Teamsu
  model: Unitree H2 EDU
  # Responde a Teamsu, Atom y Mega (con las variantes que suele escribir Whisper)
  aliases: [teamsu, timsu, tinsu, tamsu, teansu, atom, atomo, aton, mega]
audio:
  # Micrófono y altavoz internos del H2 (el PC3/Thor no tiene audio propio):
  #   entrada: UDP multicast 239.168.123.161:5555 (PCM 16 kHz mono) — verificado 2026-10-15
  #   salida:  servicio DDS `voice`, PlayStream (16 kHz mono) — verificado 2026-10-15
  transport: robot
  sample_rate_in: 16000
  sample_rate_out: 16000
  post_speech_mute_secs: 1.2   # el audio se envía con ~1 s de adelanto; cubre esa cola
  barge_in: false              # el robot ya anula su altavoz en el micrófono, pero sin barge-in por seguridad
  robot:
    network_interface: eth10
    interface_ip: 192.168.123.163
    app_name: teamsu
stt:
  model: large-v3-turbo     # POR VERIFICAR: no está en la caché local; ver README
  device: cuda
  compute_type: float16
llm:
  model: qwen3:30b-a3b-instruct-2507   # POR VERIFICAR tag exacto
  max_tokens: 110
tts: {engine: piper, voice: "test_epoch10100/zuu_10100"}   # Kokoro es opción (por verificar voz en español)
persona: >
  Eres Teamsu, asistente virtual de la UDI (Universidad de Investigación y Desarrollo, en Bucaramanga, Colombia) en un robot humanoide grande. Hablas en español colombiano,
  amable y claro, en máximo dos frases cortas. No inventes datos de la universidad.
  También te llaman Atom y Mega; responde con naturalidad a cualquiera de los tres nombres.
gestures:
  adapter: simulated        # H2: gestos DESACTIVADOS hasta confirmar SDK/API de brazos (por verificar)
  enabled: false
